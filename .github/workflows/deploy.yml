name: CI/CD Pipeline to AWS EC2

on:
  push:
    branches:
      - main 

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. Pull the code (Upgraded to v4 to fix warning)
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up the Java 8 environment (Upgraded to v4 to fix warning)
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'
        cache: maven

    # 3. Build the production executable JAR file
    # 🌟 CHANGED: Using 'mvn' instead of './mvnw' to prevent exit code 127
    - name: Build with Maven
      run: mvn clean package -DskipTests 

    # 4. Securely copy the generated JAR file to your EC2 server
    - name: Copy JAR file to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        source: "target/*.jar"
        target: "~/app/backend" 
        strip_components: 1

  # 5. Connect via SSH to stop the old app version and run the new one smoothly
    - name: SSH to EC2 and Restart Application
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ${{ secrets.EC2_USERNAME }}
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          echo "Navigating to application workspace..."
          cd ~/app/backend
          
          echo "Safely clearing the production port binding..."
          # 🌟 FIX: Looks up the process holding port 8080 and releases it silently.
          # Change 8080 to your actual Spring Boot server port if you changed it in application.properties!
          sudo fuser -k 8080/tcp || true
          
          echo "Giving the port time to release..."
          sleep 3
          
          echo "Starting the new version using nohup..."
          nohup java -jar *.jar > app.log 2>&1 </dev/null &
          
          echo "Pipeline finished successfully!"
          sleep 2